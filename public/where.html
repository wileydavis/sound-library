<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Location words</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root { color-scheme: dark; --fg: #ececec; --dim: #8a8a8a; --acc: #e8c547; --bad: #e85a47; --ok: #7fc77a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #0d0d0d; color: var(--fg); font: 16px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
    .say { color: var(--dim); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
    #words { margin: 10px 0 0; font-size: clamp(34px, 11vw, 64px); line-height: 1.1; font-weight: 700; color: var(--acc); word-break: break-word; }
    #words span { display: block; }
    #words.stale { color: var(--dim); }
    .acc { margin-top: 14px; font-size: 15px; }
    .acc b.good { color: var(--ok); } .acc b.fair { color: var(--acc); } .acc b.poor { color: var(--bad); }
    .coords { color: var(--dim); font-size: 13px; margin-top: 4px; }
    .row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    button { font: inherit; background: #1d1d1d; color: var(--fg); border: 1px solid #333; border-radius: 10px; padding: 12px 16px; }
    button.primary { background: var(--acc); color: #111; border-color: var(--acc); font-weight: 700; }
    #err { color: var(--bad); margin-top: 16px; }
    h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 34px 0 6px; }
    #log { list-style: none; padding: 0; margin: 0; font-size: 14px; }
    #log li { padding: 8px 0; border-bottom: 1px solid #222; }
    #log time { color: var(--dim); margin-right: 8px; }
    .spacer { flex: 1; }
    .note { color: var(--dim); font-size: 12px; margin-top: 24px; }
    .offline { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <div class="say">Say into the recorder: “location …”</div>
  <div id="words" class="stale"><span>finding</span><span>you…</span></div>
  <div class="acc" id="acc"></div>
  <div class="coords" id="coords"></div>
  <div id="err"></div>

  <div class="row">
    <button class="primary" id="mark">Log this spot</button>
    <button id="refresh">Refresh</button>
    <button id="copy">Copy</button>
  </div>

  <h2>Logged spots</h2>
  <ul id="log"></ul>

  <div class="spacer"></div>
  <p class="note">Works offline once opened here with signal. The four words encode your GPS to within about 10 m —
    nothing is sent anywhere. Wait for <b style="color:var(--ok)">good</b> accuracy before reading them out.</p>
  <p class="offline" id="net"></p>

  <script type="module">
    import { encodeLocation } from '/js/geowords.js';
    const $ = (id) => document.getElementById(id);
    let last = null;
    let watch = null;

    function show(pos) {
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      last = { lat, lon, accuracy, time: pos.timestamp, words: encodeLocation(lat, lon) };
      const el = $('words');
      el.replaceChildren(...last.words.map((w) => Object.assign(document.createElement('span'), { textContent: w })));
      el.classList.toggle('stale', accuracy > 50);
      const q = accuracy <= 15 ? 'good' : accuracy <= 50 ? 'fair' : 'poor';
      $('acc').innerHTML = `accuracy <b class="${q}">±${Math.round(accuracy)} m · ${q}</b>`;
      $('coords').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      $('err').textContent = '';
    }

    function start() {
      if (!('geolocation' in navigator)) { $('err').textContent = 'This browser has no location access.'; return; }
      if (watch !== null) navigator.geolocation.clearWatch(watch);
      watch = navigator.geolocation.watchPosition(show, (e) => {
        $('err').textContent = e.code === 1 ? 'Location permission is off for this site — allow it in browser settings.' : `Can't get a fix yet (${e.message}). Try outside, or wait.`;
      }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
    }

    const LOG = 'sl.where.log';
    const readLog = () => { try { return JSON.parse(localStorage.getItem(LOG)) || []; } catch { return []; } };
    function renderLog() {
      $('log').replaceChildren(...readLog().slice(0, 50).map((e) => {
        const li = document.createElement('li');
        const t = document.createElement('time');
        t.textContent = new Date(e.time).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        li.append(t, e.words.join(' '), ` ±${Math.round(e.accuracy)}m`);
        return li;
      }));
    }
    $('mark').onclick = () => {
      if (!last) return;
      const log = readLog();
      log.unshift(last);
      localStorage.setItem(LOG, JSON.stringify(log.slice(0, 500)));
      renderLog();
      navigator.vibrate?.(30);
    };
    $('refresh').onclick = start;
    $('copy').onclick = () => last && navigator.clipboard?.writeText(`location ${last.words.join(' ')}`);

    // Keep the screen on while this page is open.
    async function wake() { try { await navigator.wakeLock?.request('screen'); } catch { /* not supported */ } }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); start(); } });
    const net = () => ($('net').textContent = navigator.onLine ? '' : 'offline — still works');
    addEventListener('online', net); addEventListener('offline', net);

    net(); renderLog(); wake(); start();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>
